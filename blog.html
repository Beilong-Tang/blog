---
layout: default
title: Blog
---
<h1>Latest Posts</h1>

<ul>
  {% for post in site.posts %}
    <li>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p> {{ post.date | date: "%B %-d, %Y" }} - <a href="{{ "/tags/" | append: post.tag | relative_url }}">{{post.tag}}</a></p>
      {{ post.content | strip_html | truncate: 150 }}
    </li>
  {% endfor %}
</ul>
